# packages.conf — list of packages to install on the VPS.
# Edit this file to customize. One package per line.
# Lines starting with # are comments. Blank lines are ignored.
# Version pins use colon: package:version (e.g., go:1.26.6)
#
# The OS module reads this file and installs only what's listed.
# If a package isn't available on your OS, it's skipped with a warning.
#
# --- Core (always recommended) ---
docker              # Container runtime (required for anywaye stack)
git                 # Version control
curl                # HTTP client
wget                # File downloader
jq                  # JSON processor
unzip               # Archive extraction
build-essential     # Compilers and build tools (gcc, make, etc.)

# --- Development toolchains ---
go:1.26.6           # Go (required for anywaye services)
node:22             # Node.js (required for website)
python3             # Python (required for ella)
python3-venv        # Python virtual environments

# --- Database clients ---
postgresql-client   # psql for migrations
redis-tools         # redis-cli for debugging

# --- CLI tools ---
gh                  # GitHub CLI (PRs, issues, releases)
helm:4.3.0          # Kubernetes package manager (for anywaye prod)
bw                  # Bitwarden CLI (secret management)
osv-scanner         # Vulnerability scanner (used by ship security scans)

# --- Optional (uncomment if needed) ---
# postgresql        # Full Postgres (if not using Docker)
# redis-server      # Full Redis (if not using Docker)
# nginx             # Reverse proxy (if not using Caddy/Traefik)
# caddy             # Reverse proxy with auto-HTTPS
# tmux              # Terminal multiplexer
# htop              # Process monitor
# ncdu              # Disk usage analyzer