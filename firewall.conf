# firewall.conf — custom firewall rules.
# Used when FIREWALL_MODE=custom.
# One rule per line. Lines starting with # are comments.
# Format: <action> <port/protocol> [from <source>] [comment '<text>']
#
# Examples:
#   allow 22/tcp from 10.0.0.0/8   # SSH from internal network
#   allow 80/tcp                   # HTTP
#   allow 443/tcp                  # HTTPS
#   allow 41641/udp                # Tailscale
#
# If FIREWALL_MODE is not "custom", this file is ignored.
# Dev mode: Tailscale-only (no public ports).
# Prod mode: 80/443 + SSH + Tailscale.